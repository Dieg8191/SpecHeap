[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "specheap"
version = "0.1.0"
description = "Local-first Spec-Driven Development workspace with an MCP interface for AI agents."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6",
    "mcp>=2,<3",
]

[project.scripts]
specheap = "specheap.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/specheap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
