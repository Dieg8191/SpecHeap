{% extends "base.html" %}
{% block title %}Not found · SpecHeap{% endblock %}
{% block content %}
<h1>Item not found</h1>
<div class="error" role="alert">
  <strong>{{ error.code }}</strong>: {{ error.message }}
  {% if error.hint %}<div class="muted">{{ error.hint }}</div>{% endif %}
</div>
<p><a href="/">Back to overview</a></p>
{% endblock %}
